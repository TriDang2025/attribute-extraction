      - {name: "Train arrive by", level: "L1", source: "tear", mwoz22_slot: "train-arriveby", description: "arrival time of the train", type: "time", role_partner: "Train leave at", database_column: "yes (column arriveBy)", mentions_dev50: 32, mentions_dev50b: 25}
      - {name: "Train day", level: "L1", source: "tear", mwoz22_slot: "train-day", description: "day of the train", type: "day", categorical: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"], database_column: "yes (column day)", mentions_dev50: 41, mentions_dev50b: 23}
      - {name: "Train departure", level: "L1", source: "tear", mwoz22_slot: "train-departure", description: "departure location of the train", type: "text", role_partner: "Train destination", database_column: "yes (column departure)", mentions_dev50: 48, mentions_dev50b: 25}
      - {name: "Train destination", level: "L1", source: "tear", mwoz22_slot: "train-destination", description: "destination of the train", type: "text", role_partner: "Train departure", database_column: "yes (column destination)", mentions_dev50: 41, mentions_dev50b: 33}
      - {name: "Train leave at", level: "L1", source: "tear", mwoz22_slot: "train-leaveat", description: "leaving time for the train", type: "time", role_partner: "Train arrive by", database_column: "yes (column leaveAt)", mentions_dev50: 58, mentions_dev50b: 20}
      - {name: "Train duration", level: "L2", source: "schema_slot", mwoz22_slot: "train-duration", description: "duration of the travel", type: "duration", database_column: "yes (column duration)", mentions_dev50: 8, mentions_dev50b: 3}
      - {name: "Train price", level: "L2", source: "schema_slot", mwoz22_slot: "train-price", description: "price of the train", type: "price", database_column: "yes (column price)", mentions_dev50: 14, mentions_dev50b: 9}
      - {name: "Train trainid", level: "L2", source: "schema_slot", mwoz22_slot: "train-trainid", description: "id of the train", type: "id", database_column: "yes (column trainID)", mentions_dev50: 32, mentions_dev50b: 16, role: "primary_key"}
    links: []

  - name: train_booking
