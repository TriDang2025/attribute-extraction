# =====================================================================
# Schema Ground Truth (GT) — TEAR Conversation dataset (MultiWOZ), dev50 + dev50b
# version 5. Built by build_schema_gt.py from attribute_gt_2026-11-02.txt
#
# Every column field is copied from the attribute GT file.
# Added by hand: the place/booking table split, 5 key/link columns (source: added),
# soft links (taxi -> places) and shared value sets.
# =====================================================================

meta:
  attribute_gt_file: attribute_gt_2026-11-02.txt
  dataset: TEAR Conversation (MultiWOZ)
  dev_sets: [dev50, dev50b]
  pipeline_output: SQL (CREATE TABLE ...)

matching:
  - "A predicted column is correct if it means the same as a GT column and is in a table of the same entity."
  - "The name does not need to match: same, close or different names are all fine."
  - "Right meaning in the wrong entity is wrong."
  - "Booking columns may be in the place table or in a booking table. If they are in the place table, the booking id and link columns are not needed."
  - "Links (foreign keys) are required. Soft links and shared values are not required: a predicted link or lookup table that matches one is correct, a missing one is not counted."

not_columns:   # from the attribute GT file, Sections 2 and 4
  - "Database columns with no schema slot and 0 dev mentions: Hotel n, Hotel price, Hotel takesbookings, Restaurant introduction, Restaurant signature, Restaurant type"
  - "id and location database columns (id-like)"
  - "choice (number of results): noise, not in the official schema"

shared_values:   # same list of values in several tables; no link (a lookup table would be optional)
  - {values_of: "area", columns: ["Hotel area", "Restaurant area", "Attraction area"], values: ["centre", "east", "north", "south", "west"]}
  - {values_of: "price range", columns: ["Hotel price range", "Restaurant price range"], values: ["cheap", "expensive", "moderate"]}
  - {values_of: "day", columns: ["Train day", "Hotel requested day", "Restaurant requested day"], values: ["friday", "monday", "saturday", "sunday", "thursday", "tuesday", "wednesday"]}

not_connected:
  - "train has no link to hotel, restaurant, taxi or attraction: its departure/destination are cities and stations, which no other table has."

tables:

  - name: train
    entity: train
    key: ["Train trainid"]
